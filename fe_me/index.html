<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <!--
      NOTE: never place a Quasar template-engine control tag inside an HTML
      attribute value. @quasar/app-vite renders this file with its own Eta-like
      engine (lib/utils/template.js) and that engine's attribute scanner aborts
      when a control tag appears inside quotes, which surfaces at runtime as the
      "HTML template compilation error" page. Literal attribute values are always
      safe, so keep conditionals out of attributes.

      Also avoid writing control-tag delimiters inside an HTML comment: this file
      is parsed as a template before the browser ever sees it, so comment text is
      not inert. That is exactly what broke this page once already.
    -->
    <title>حسام آق آتابای — توسعه‌دهنده فول‌استک</title>

    <meta charset="utf-8" />
    <meta
      name="description"
      content="نمونه‌کارها، مهارت‌ها و سوابق کاری حسام آق آتابای — توسعه‌دهنده فول‌استک Laravel و Vue.js"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />

    <!--
      Vazirmatn: the standard Persian webfont, used for the RTL typography.
      Inter: the Latin face, enabled through `html[lang="en-US"]` in app.scss so
      English copy is not rendered with Persian-tuned Latin glyphs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <script>
      /*
        Applies the saved theme *and* language direction before this document's
        scripts run, so a visitor never sees the dark palette or the RTL layout
        flash before their own preference loads. Mirrors src/boot/theme.js and
        src/composables/useLocale.js: Quasar's own `q-dark` / `q-lang` keys hold
        the choice, and both boot files keep ownership afterwards.
      */
      ;(() => {
        let stored = null
        let storedLocale = null
        try {
          stored = window.localStorage.getItem('q-dark')
          storedLocale = window.localStorage.getItem('q-lang')
        } catch {
          /* storage unavailable — fall through to the system preferences */
        }

        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches

        const wantsDark = stored === 'true' || (stored !== 'false' && prefersDark)

        document.body.classList.add(wantsDark ? 'body--dark' : 'body--light')

        // A stored "en" flips the document to LTR for the first paint too.
        if (storedLocale === 'en') {
          document.documentElement.setAttribute('dir', 'ltr')
          document.documentElement.setAttribute('lang', 'en-US')
        }
      })()
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
