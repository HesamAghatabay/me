<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <!--
      NOTE: never place a Quasar template-engine control tag inside an HTML
      attribute value. @quasar/app-vite renders this file with its own Eta-like
      engine (lib/utils/template.js) and that engine's attribute scanner aborts
      when a control tag appears inside quotes, which surfaces at runtime as the
      "HTML template compilation error" page. Literal attribute values are always
      safe, so keep conditionals out of attributes.

      Also avoid writing control-tag delimiters inside an HTML comment: this file
      is parsed as a template before the browser ever sees it, so comment text is
      not inert. That is exactly what broke this page once already.
    -->
    <title>حسام آق آتابای — توسعه‌دهنده فول‌استک</title>

    <meta charset="utf-8" />
    <meta
      name="description"
      content="نمونه‌کارها، مهارت‌ها و سوابق کاری حسام آق آتابای — توسعه‌دهنده فول‌استک Laravel و Vue.js"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />

    <script>
      /*
        Applies the theme before this document's scripts run, so a visitor who
        picked light mode never sees the dark palette (the design system's
        default) flash on load. Mirrors src/boot/theme.js: the stored value is
        Quasar's own `q-dark` key, `true`/`false` are explicit picks and
        anything else means "follow the operating system". Boot keeps ownership
        after this — it re-applies the same decision through $q.dark.
      */
      ;(() => {
        let stored = null
        try {
          stored = window.localStorage.getItem('q-dark')
        } catch {
          /* storage unavailable — fall through to the OS preference */
        }

        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches

        const wantsDark = stored === 'true' || (stored !== 'false' && prefersDark)

        document.body.classList.add(wantsDark ? 'body--dark' : 'body--light')
      })()
    </script>

    <!-- Vazirmatn: the standard Persian webfont used for RTL Persian typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
